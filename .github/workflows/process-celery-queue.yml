name: Process InsightDocs queue

on:
  schedule:
    # GitHub Actions supports a minimum five-minute cadence. Fifteen minutes
    # avoids overlapping model downloads and keeps public-runner use bounded.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Never run two consumers simultaneously: ingestion writes to shared services.
concurrency:
  group: insightdocs-celery-queue
  cancel-in-progress: false

jobs:
  process-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      APP_ENV: production
      DEBUG: "false"
      LOG_LEVEL: INFO
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      CELERY_BROKER_URL: ${{ secrets.CELERY_BROKER_URL }}
      CELERY_RESULT_BACKEND: ${{ secrets.CELERY_RESULT_BACKEND }}
      MILVUS_URI: ${{ secrets.MILVUS_URI }}
      MILVUS_TOKEN: ${{ secrets.MILVUS_TOKEN }}
      MILVUS_COLLECTION: ${{ secrets.MILVUS_COLLECTION }}
      MILVUS_DIM: ${{ secrets.MILVUS_DIM }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install document-processing system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libgomp1 tesseract-ocr libreoffice-nogui imagemagick
          sudo sed -i 's/domain="coder" rights="none" pattern="PDF"/domain="coder" rights="read|write" pattern="PDF"/g' /etc/ImageMagick-6/policy.xml || true

      - name: Install Python dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Consume queued document tasks for twelve minutes
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=2m 12m \
            celery -A backend.workers.celery_app worker \
              --loglevel=info \
              --concurrency=1 \
              --prefetch-multiplier=1 \
              --without-gossip \
              --without-mingle \
              --without-heartbeat
          status=$?
          # timeout returns 124 after sending TERM. This is normal: the next
          # scheduled run continues draining the queue. Late acknowledgements
          # preserve any task that did not finish before shutdown.
          if [ "$status" -eq 124 ] || [ "$status" -eq 143 ]; then
            echo "Worker window ended normally (status $status)."
            exit 0
          fi
          exit "$status"
